<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/media/icon.png">
    <title>Weather App</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header>
        <h1>Weather App</h1>
    </header>

    <div class="text">
        <h2>Get Current Weather</h2>
        <p>Enter a city name to get the current weather information.</p>
    </div>
    <div class="search-container">
        <input type="text" id="cityInput" placeholder="Enter city name..." />
        <button onclick="getWeather()">Search</button>
    </div>

    <div class="weather-container">
        <div class="card">
            <h2>Humidity</h2>
            <p id="humidity">--%</p>
        </div>

        <div class="card">
            <h2 id="location">Temperature</h2>
            <p id="temperature">--°C</p>
            <p id="condition">Condition</p>
        </div>

        <div class="card">
            <h2>Wind Speed</h2>
            <p id="windSpeed">-- km/h</p>
        </div>
    </div>
    <div class="footer">
        <p>Powered by <u><i>Sheikh Ahmad</i></u></p>
    </div>

    <script src="assets/javascript/script.js"></script>
</body>

</html>
